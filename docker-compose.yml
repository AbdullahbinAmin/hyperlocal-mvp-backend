services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      - DB_USER=postgres
      - DB_PASS=postgres
      - DB_HOST=db
      - DB_PORT=5432
      - DB_NAME=hyperlocal
      - JWT_SECRET=supersecretkeypleasechangeme
      - ENVIRONMENT=local
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - .:/app  # Optional: for hot-reloading in dev you'd run with --reload

  db:
    image: postgres:15-alpine
    restart: always
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=hyperlocal
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d hyperlocal"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
